# StarRailCopilot-Web — Full Stack Docker Compose
# Webdeck (Go Gateway with built-in Chromium) + SRC (Python scheduler)
#
# Quick start:
#   1. Place cloud_auth.json in this directory
#   2. docker compose up --build
#   3. Open http://localhost:8090 for WebUI

services:
  webdeck:
    build:
      context: ../webdeck
      dockerfile: Dockerfile
    container_name: src-webdeck
    ports:
      - "8090:8090"
    volumes:
      - ./cloud_auth.json:/app/cloud_auth.json
    command:
      - "--auth=cloud_auth.json"
      - "--port=8090"
      - "--fps=30"
      - "--jpeg-quality=75"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  src:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: src-scheduler
    ports:
      - "22367:22367"
    volumes:
      - ./assets:/app/assets
      - ./log:/app/log
    depends_on:
      - webdeck
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
